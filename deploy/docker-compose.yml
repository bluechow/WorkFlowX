# ============================================================
# WorkFlowX 部署编排（Phase 16; P16-02/08~12）
# 架构: Browser → Nginx(frontend) → backend → mysql/redis/minio
#
# 与开发编排 compose.yaml 分离：
#   开发基础设施: docker compose -f compose.yaml up -d（仅 mysql/redis/minio，端口 3307/6379/9000）
#   部署全栈:     docker compose -f deploy/docker-compose.yml --project-directory deploy up -d
#
# 网络: 所有服务经 service name 通信（禁止容器内 localhost 互连）
# 凭据: 全部来自 .env（参照 .env.example），源码不落生产 secret
# ============================================================

name: workflowx-deploy

services:
  mysql:
    image: mysql:8.0
    container_name: workflowx-deploy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workflowx}
      MYSQL_USER: ${MYSQL_APP_USER:-workflowx}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    # 安全评审（P16-34）: MySQL 不向宿主机暴露端口，仅集群网络内可达
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.2
    container_name: workflowx-deploy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    # 安全评审: Redis 不向宿主机暴露；auth session 数据 AOF 持久化
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: workflowx-deploy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    # 安全评审: API 9000 不向宿主机暴露（经 backend 访问）；Console 9001 按需自行放开
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    container_name: workflowx-deploy-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-workflowx}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo 'minio-init: bucket ready'"

  backend:
    image: workflowx/backend:latest
    container_name: workflowx-deploy-backend
    restart: unless-stopped
    build:
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DEMO_SEED: ${DEMO_SEED:-false}
      # 数据库（dev/prod profile 均读这些变量；容器网络用 service name）
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workflowx}
      MYSQL_USERNAME: ${MYSQL_APP_USER:-workflowx}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD is required}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-workflowx}
      # JWT（部署必须显式提供强密钥；dev profile 有本地默认，见 .env.example）
      JWT_SECRET: ${JWT_SECRET:-}
      TZ: ${TZ:-Asia/Shanghai}
    # 安全评审（P16-34）: backend 不向宿主机暴露端口——浏览器经 Nginx /api 反代访问
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    image: workflowx/frontend:latest
    container_name: workflowx-deploy-frontend
    restart: unless-stopped
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  mysql-data:
    name: workflowx-deploy-mysql-data
  redis-data:
    name: workflowx-deploy-redis-data
  minio-data:
    name: workflowx-deploy-minio-data
