spring:
  application:
    name: workflowx-backend
  servlet:
    multipart:
      # 略高于业务上限（attachment.max-size-bytes），超限由 MaxUploadSizeExceededException 统一转 413
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:11MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:12MB}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

# 附件策略（Phase 8; ADR-018）
attachment:
  max-size-bytes: ${ATTACHMENT_MAX_SIZE_BYTES:10485760}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui
    enabled: ${SPRINGDOC_ENABLED:true}

jwt:
  # dev-only 默认密钥（HS256 要求 ≥32 字节）；生产环境必须通过 JWT_SECRET 环境变量显式提供
  secret: ${JWT_SECRET:dev-only-jwt-secret-key-for-workflowx-local-0123456789}
  expire-hours: ${JWT_EXPIRE_HOURS:2}
  issuer: workflowx
