# 开发环境：连接仓库根目录 compose.yaml 提供的基础设施（ADR-007）
# MySQL 主机端口 3307（本机 3306 被遗留服务占用），容器内 3306
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:workflowx}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:workflowx_dev_root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # db/migration: 公共迁移（V1 表结构）；db/seed/dev: 仅 dev 的种子数据（prod 不配置此 location）
    locations: classpath:db/migration,classpath:db/seed/dev
    baseline-on-migrate: false

logging:
  level:
    com.workflowx: debug

# MinIO（compose.yaml 基础设施；ADR-018）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:workflowx_dev_minio}
  bucket: ${MINIO_BUCKET:workflowx}
