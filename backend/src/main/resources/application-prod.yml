# 生产环境：所有配置必须由环境变量注入，禁止默认密码（Master Prompt §29-9）
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:?MYSQL_HOST is required}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${MYSQL_USERNAME:?MYSQL_USERNAME is required}
    password: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:?REDIS_HOST is required}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

logging:
  level:
    com.workflowx: info

# 生产环境默认关闭 API 文档端点
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

# JWT：secret 必须显式提供，缺失/为空则启动失败（禁止默认值）
jwt:
  secret: ${JWT_SECRET:?JWT_SECRET is required}
  expire-hours: ${JWT_EXPIRE_HOURS:2}
  issuer: workflowx
