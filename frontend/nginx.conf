# WorkFlowX 部署 Nginx 配置（Phase 16; P16-06/07）
# SPA history 路由（try_files 防刷新 404）+ /api 反向代理到 backend 容器

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode: 未知路径回退 index.html，刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（Vite 产物带内容哈希）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API 反向代理：浏览器只访问 Frontend host，不直连 backend 容器
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 20m;   # 覆盖附件上限 10MB + multipart 开销
    }

    # index.html 不缓存（保证发版后前端立即更新）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
