name: CI

# ============================================================
# WorkFlowX CI（Phase 17）
# 触发: push/PR → master/main
# Jobs:
#   frontend      — lint / Vitest / build
#   backend       — Maven test（含集成测试，MySQL service + Flyway 自动迁移）
#   api-ui-e2e    — 真实全栈（infra services + backend jar + vite dev）→ pytest + Playwright
#   docker-build  — compose config + backend/frontend 镜像构建
#   security-scan — secrets scan（脚本与本地/Phase 15 一致）
# 凭据: 全部来自 GitHub Services 默认值/env（仓库不含任何真实 secret）
# ============================================================

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ Frontend ============
  frontend:
    name: Frontend (lint / Vitest / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: npm audit（高危漏洞报告；v2.0.1 过渡为不阻断）
        working-directory: frontend
        run: npm audit --audit-level=high
        # 过渡策略：首跑证实存在 high 级告警（预计随 dependabot 小版本升级消除）。
        # 合并升级 PR 后确认本步骤输出为 0 high，再删除 continue-on-error 恢复阻断。
        continue-on-error: true
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: Vitest
        working-directory: frontend
        run: npm run test -- --run
      - name: build
        working-directory: frontend
        run: npm run build

  # ============ Backend ============
  backend:
    name: Backend (Maven test)
    runs-on: ubuntu-latest
    # v2.0.1：服务容器改为步骤内启动（原 services: 匿名拉取，Docker Hub 限流/撤回时
    # 错误不透明且不可登录）。此处仅声明端口供 runner 预留语义，实际启动见步骤。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # 可选 Docker Hub 登录（配置 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets 后自动启用，
      # 匿名限流 429 时必需；未配置则跳过）
      - name: 登录 Docker Hub（可选）
        if: env.DH_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      - name: 启动基础服务（MySQL/Redis/MinIO，重试 + 自诊断）
        run: |
          set -e
          pull_retry() {  # 用法: pull_retry <image>
            local img="$1"
            for i in 1 2 3; do
              if docker pull "$img"; then return 0; fi
              echo "::warning::pull $img 失败（第 $i 次），重试前自诊断↓"
              # 自诊断：匿名 token + manifest 请求，把 registry 原始状态打进日志
              TOK=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${img#*/}:pull" | grep -o '"token":"[^"]*"' | head -1 || true)
              echo "registry-token: ${TOK:0:20}..." || true
              curl -s -o /dev/null -w "manifest HTTP %{http_code}" "https://registry-1.docker.io/v2/${img#*/}/manifests/${img##*:}" || true
              sleep $((i*5))
            done
            echo "::error::镜像 $img 三次拉取失败"; return 1
          }
          pull_retry mysql:8.0
          pull_retry redis:7.2
          pull_retry quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          docker run -d --name ci-mysql -p 3307:3306 \
            -e MYSQL_ROOT_PASSWORD=ci_root_password -e MYSQL_DATABASE=workflowx -e TZ=Asia/Shanghai \
            mysql:8.0 --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
          docker run -d --name ci-redis -p 6379:6379 redis:7.2
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=ci_minio_password \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          # 等待就绪（明确失败条件）
          for i in $(seq 1 30); do
            docker exec ci-mysql mysqladmin ping -h127.0.0.1 -uroot -pci_root_password --silent 2>/dev/null && break
            sleep 2
          done
          docker exec ci-mysql mysqladmin ping -h127.0.0.1 -uroot -pci_root_password --silent
          docker exec ci-redis redis-cli ping
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break; sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live
      - name: MinIO bucket 初始化
        run: |
          docker run --rm --network host \
            -e MC_HOST_local="http://minioadmin:ci_minio_password@localhost:9000" \
            --entrypoint sh minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 \
            -c "mc mb --ignore-existing local/workflowx" || {
            echo "mc digest 拉取失败时回退 latest（mc 未撤回）"; docker run --rm --network host \
            -e MC_HOST_local="http://minioadmin:ci_minio_password@localhost:9000" \
            --entrypoint sh minio/mc:latest -c "mc mb --ignore-existing local/workflowx"; }
      - name: Maven test（Flyway 自动迁移 + dev seed）
        working-directory: backend
        run: mvn -B test
      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ============ API + UI 端到端（真实全栈） ============
  api-ui-e2e:
    name: API & UI E2E (pytest / Playwright)
    runs-on: ubuntu-latest
    # v2.0.1：服务容器改为步骤内启动（与 backend job 同策略：可登录/重试/自诊断）
    steps:
      - uses: actions/checkout@v4
      - name: 登录 Docker Hub（可选）
        if: env.DH_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      - name: 启动基础服务（MySQL/Redis/MinIO，重试 + 自诊断）
        run: |
          set -e
          pull_retry() {
            local img="$1"
            for i in 1 2 3; do
              if docker pull "$img"; then return 0; fi
              echo "::warning::pull $img 失败（第 $i 次），重试前自诊断↓"
              curl -s -o /dev/null -w "manifest HTTP %{http_code}" "https://registry-1.docker.io/v2/${img#*/}/manifests/${img##*:}" || true
              sleep $((i*5))
            done
            echo "::error::镜像 $img 三次拉取失败"; return 1
          }
          pull_retry mysql:8.0
          pull_retry redis:7.2
          pull_retry quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          docker run -d --name ci-mysql -p 3307:3306 \
            -e MYSQL_ROOT_PASSWORD=ci_root_password -e MYSQL_DATABASE=workflowx -e TZ=Asia/Shanghai \
            mysql:8.0 --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
          docker run -d --name ci-redis -p 6379:6379 redis:7.2
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=ci_minio_password \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            docker exec ci-mysql mysqladmin ping -h127.0.0.1 -uroot -pci_root_password --silent 2>/dev/null && break
            sleep 2
          done
          docker exec ci-mysql mysqladmin ping -h127.0.0.1 -uroot -pci_root_password --silent
          docker exec ci-redis redis-cli ping
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break; sleep 2
          done
          curl -sf http://localhost:9000/minio/health/live
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 Python 依赖
        run: pip install -r tests/requirements.txt

      # MinIO bucket 初始化（复用 Phase 16 minio-init 方式）
      - name: MinIO bucket 初始化
        run: |
          docker run --rm --network host \
            -e MC_HOST_local="http://minioadmin:ci_minio_password@localhost:9000" \
            --entrypoint sh minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 -c "mc mb --ignore-existing local/workflowx"

      # 后端构建 + 运行（dev profile: Flyway V1~V14 + dev seed admin/user1）
      - name: Maven package（跳过测试——测试由 backend job 与本 job e2e 承担）
        working-directory: backend
        run: mvn -B package -DskipTests
      - name: 启动后端（等待 health 就绪）
        working-directory: backend
        run: |
          nohup java -jar target/workflowx-backend-0.1.0-SNAPSHOT.jar \
            --server.port=8080 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            if [ "$CODE" = "200" ]; then echo "backend ready (attempt $i)"; exit 0; fi
            sleep 2
          done
          echo "backend 未就绪"; tail -100 /tmp/backend.log; exit 1

      # 前端 dev server（Playwright 目标）
      - name: 启动前端 dev server
        working-directory: frontend
        run: |
          npm ci
          nohup npm run dev -- --port 5173 --strictPort > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173 || true)
            if [ "$CODE" = "200" ]; then echo "vite ready (attempt $i)"; exit 0; fi
            sleep 2
          done
          echo "vite 未就绪"; tail -50 /tmp/vite.log; exit 1

      # Playwright 浏览器
      - name: 安装 Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: pytest 全量（真实 HTTP → Docker 级全栈）
        working-directory: tests/api
        run: python -m pytest -q

      - name: pytest 报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: |
            /tmp/backend.log
          retention-days: 7

      - name: Playwright 全量
        working-directory: frontend
        run: npx playwright test
      - name: Playwright 报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  # ============ Docker ============
  docker-build:
    name: Docker (compose config + image build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config 校验
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config --quiet
      - name: build backend 镜像
        run: docker build -f backend/Dockerfile -t workflowx/backend:ci .
      - name: build frontend 镜像
        run: docker build -f frontend/Dockerfile -t workflowx/frontend:ci frontend
      - name: 记录镜像大小
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep workflowx

  # ============ Security ============
  security-scan:
    name: Security (secrets scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secrets scan
        run: bash scripts/ci/secrets-scan.sh
