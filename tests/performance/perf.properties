# WorkFlowX 性能测试参数（Phase 14; ADR 记录于 gate）
# 覆盖方式: jmeter -n -t jmeter/workflowx-perf.jmx -q perf.properties -l results/xx.jtl
BASE_URL=http://localhost:8080
HOST=localhost
PORT=8080
API_PREFIX=/api/v1
TEST_NAMESPACE=PERF
# 负载等级（命令行 -J 覆盖）
